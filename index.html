:root{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:#f4f3f8;background:#090b12;font-synthesis:none;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;--bg:#090b12;--surface:#12151e;--surface2:#171a26;--surface3:#202332;--border:rgba(210,216,246,.09);--muted:#9c9caa;--subtle:#686a7b;--purple:#9c64fa;--purple-light:#c3a7ff;--green:#5ce2a3;--orange:#f8b46a;--radius:18px;--radius-lg:24px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-width:320px;min-height:100vh;background:var(--bg)}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.46}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #bd9dff;outline-offset:3px}a{color:inherit;text-decoration:none}h1,h2,h3,p{margin-top:0}img{max-width:100%}.svg-icon{display:inline-block;flex-shrink:0;vertical-align:middle}.muted{color:var(--muted)}.initial-loading{min-height:100vh;display:grid;place-content:center;text-align:center;color:var(--muted);gap:12px}.pulse-logo{color:var(--purple);font-size:44px}.fatal{padding:64px 20px;max-width:550px;margin:auto}.app-shell{min-height:100vh;display:flex}.desktop-side{width:258px;position:sticky;top:0;height:100vh;flex-shrink:0;border-right:1px solid var(--border);background:linear-gradient(165deg,#11121b,#0a0c13 75%);padding:29px 18px 22px;display:flex;flex-direction:column;z-index:4}.brand{display:flex;align-items:center;gap:10px;padding:0 10px 41px}.brand img{width:44px;height:44px}.brand strong{font-size:16px;letter-spacing:.06em;white-space:nowrap}.brand strong span{color:var(--purple-light)}.brand small{display:block;font-size:7px;letter-spacing:.28em;font-weight:800;margin-top:4px;color:#9b95a6}.side-group-label{font-size:10px;letter-spacing:.15em;font-weight:800;color:#6d7082;margin:0 13px 13px}.side-link{position:relative;border:0;background:transparent;width:100%;display:flex;align-items:center;gap:13px;padding:14px 15px;border-radius:12px;color:#9798a7;text-align:left;font-size:13px;font-weight:650;margin-bottom:5px;transition:background .2s,color .2s}.side-link:hover{background:#1a1c28;color:#f5f2ff}.side-link.selected{color:#cbafff;background:rgba(151,99,249,.12)}.side-selected-mark{position:absolute;right:11px;width:6px;height:6px;border-radius:50%;background:var(--purple);box-shadow:0 0 12px var(--purple)}.sidebar-space{flex:1}.side-note{font-size:11px;line-height:1.5;color:#a9a6b7;padding:17px 15px;border:1px solid var(--border);background:rgba(255,255,255,.025);border-radius:14px}.side-note-sub{margin:10px 0 0 14px;color:#6e6c80;font-size:10px}.online-dot{display:inline-block;width:7px;height:7px;background:var(--green);border-radius:50%;margin-right:7px;box-shadow:0 0 8px rgba(92,226,163,.35)}.app-body{flex:1;min-width:0}.topbar{height:84px;padding:0 clamp(26px,5vw,80px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:rgba(10,12,19,.86)}.topbar-context{color:#85879a;font-size:12px;letter-spacing:.04em}.top-actions{display:flex;align-items:center;gap:23px}.system-status{font-size:11px;color:#85879a}.profile-chip{border:1px solid rgba(193,162,255,.3);background:linear-gradient(135deg,#54428b,#271c4a);color:#f4eaff;width:34px;height:34px;border-radius:50%;font-size:12px;font-weight:700}.mobile-brand,.bottom-nav{display:none}.content{max-width:1450px;margin:auto;padding:46px clamp(26px,5vw,80px) 85px}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.18em;color:var(--purple-light);text-transform:uppercase}.page-head{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:29px}.page-head h1{font-size:clamp(29px,3vw,43px);line-height:1.12;letter-spacing:-.055em;font-weight:750;margin:10px 0 10px}.page-head p{color:#9897a8;font-size:13px;margin:0;line-height:1.65}.wave{color:#bfa0ff;font-size:20px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:15px;width:100%}.section-head h2{font-size:19px;letter-spacing:-.035em;font-weight:720;margin:0}.section-head p{color:#8f91a2;font-size:12px;line-height:1.55;margin:6px 0 0}.section-title-spacer{margin:31px 0 18px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:12px 17px;font-size:12px;font-weight:720;letter-spacing:-.008em;border:1px solid transparent;border-radius:11px;min-height:42px;white-space:nowrap;transition:filter .18s,transform .18s,border-color .18s,background .18s}.btn:hover:not(:disabled){filter:brightness(1.1);transform:translateY(-1px)}.btn:active:not(:disabled){transform:translateY(0)}.btn-primary{background:linear-gradient(112deg,#8543f4,#a76afc);color:#fff;box-shadow:0 5px 23px rgba(112,58,224,.25)}.btn-outline{background:#151721;border-color:rgba(235,231,255,.13);color:#e5e0f0}.btn-ghost{background:rgba(240,240,255,.12);color:#f5f2fc;border-color:rgba(240,240,255,.12)}.btn-soft{background:rgba(157,108,245,.17);color:#cfb5ff;border:1px solid rgba(166,112,255,.18)}.btn-danger{background:rgba(255,112,133,.1);border-color:rgba(255,112,133,.26);color:#ff9eae}.btn-mini{font-size:11px;padding:9px 12px;min-height:35px}.btn-large{font-size:13px;padding:14px 20px;min-height:50px}.btn-block{width:100%}.round-button,.icon-button{border:1px solid var(--border);background:#1a1b27;color:#c5c3d1;display:grid;place-items:center;width:36px;height:36px;border-radius:10px}.round-button:hover,.icon-button:hover{border-color:#9361e5;color:#fff}.link-action,.text-action{background:none;border:0;color:#b89bf1;display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:11px;padding:4px 0}.link-action:hover,.text-action:hover{color:#e2d1ff}.week-tag{font-size:10px;color:#9794ab;border:1px solid var(--border);padding:8px 11px;border-radius:8px;white-space:nowrap}

/* Planner */
.plan-toolbar{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--border);background:#141720;border-radius:14px;padding:16px 18px;margin-bottom:17px}.plan-dates{display:flex;align-items:center;gap:15px}.plan-dates>div{display:flex;flex-direction:column;gap:4px;text-align:center}.plan-dates strong{font-size:13px;white-space:nowrap}.plan-dates span{font-size:11px;color:var(--muted)}.plan-progress{display:flex;gap:8px;align-items:center;color:#9d9bab;font-size:11px}.week-board{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}.day-card{border:1px solid var(--border);background:linear-gradient(180deg,#191b28,#11131c);border-radius:17px;min-height:270px;display:flex;flex-direction:column;padding:15px 12px;transition:border .2s,transform .2s}.day-card:hover{border-color:rgba(168,127,241,.25)}.day-card.today{border-color:rgba(170,105,255,.62);box-shadow:0 0 30px rgba(134,82,241,.08)}.day-card.rest-day{background:linear-gradient(180deg,#141822,#0e131a)}.day-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:4px}.day-card-head>div{display:flex;flex-direction:column;gap:4px}.day-name{font-size:10px;color:#9292a5}.day-card-head strong{font-size:20px}.day-card-head .pill{padding:4px 5px;font-size:8px}.day-card-body{padding-top:27px;flex:1}.activity-mark{display:inline-flex;align-items:center;justify-content:center;width:39px;height:39px;border-radius:11px;background:rgba(131,126,166,.1);color:#b3abc9}.activity-mark.strength{background:rgba(161,107,255,.15);color:#c39bf9}.activity-mark.cardio{background:rgba(66,189,192,.14);color:#79d5cc}.activity-mark.mobility{background:rgba(235,167,107,.1);color:#efc299}.day-card h3{font-size:12px;line-height:1.35;letter-spacing:-.01em;margin:15px 0 8px;font-weight:720}.day-card p{font-size:10px;color:#8b8c9f;line-height:1.5}.day-card-actions{display:flex;align-items:center;justify-content:space-between;gap:5px;padding-top:10px}.day-card-actions .icon-button{width:30px;height:32px;flex-shrink:0}.completed-label{color:#69ddaa;font-size:10px;display:flex;align-items:center;gap:5px}.muted-label{font-size:10px;color:#808093}.tip-panel{display:flex;align-items:flex-start;gap:12px;background:rgba(108,94,166,.085);border:1px solid rgba(170,145,226,.13);border-radius:14px;padding:17px 20px;margin-top:22px;color:#ae9ccf}.tip-panel strong{display:block;color:#dfd5f0;font-size:12px;margin-bottom:6px}.tip-panel p{font-size:11px;line-height:1.65;margin:0;color:#a5a1b5}
/* Training */
.featured-plan{border:1px solid rgba(148,110,230,.32);padding:29px;border-radius:20px;background:linear-gradient(95deg,#271c3e,#131521)}.featured-plan h2{font-size:31px;letter-spacing:-.045em;margin:16px 0 8px}.featured-plan p{font-size:12px;color:#ada8bd;margin-bottom:22px}.session-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.session-option{display:flex;align-items:center;gap:15px;text-align:left;color:#f5f0ff;background:#151721;border:1px solid var(--border);padding:17px 19px;border-radius:14px}.session-option:hover{border-color:rgba(174,119,248,.45)}.session-option>span:nth-child(2){flex:1;min-width:0}.session-option strong{display:block;font-size:13px;line-height:1.4}.session-option small{display:block;font-size:10px;color:#9995ac;margin-top:7px}.workout-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:27px}.back-button{background:none;border:0;color:#aba7b9;display:flex;align-items:center;gap:4px;font-size:11px}.workout-saved{color:#73d7a5;display:flex;align-items:center;gap:6px;font-size:10px}.workout-title-row{display:flex;justify-content:space-between;gap:20px;align-items:center}.workout-title-row h1{font-size:clamp(27px,3vw,40px);margin:10px 0;letter-spacing:-.05em}.workout-title-row p{font-size:12px;color:#8e90a1}.progress-circle{width:71px;height:71px;flex-shrink:0;border-radius:50%;background:conic-gradient(var(--purple) calc(var(--pct)*1%),rgba(230,230,250,.08) 0);display:grid;place-items:center}.progress-circle:before{content:"";position:absolute;width:60px;height:60px;border-radius:50%;background:#11131b}.progress-circle span{position:relative;font-size:13px;font-weight:760}.workout-progress-track{height:5px;border-radius:5px;background:#272438;overflow:hidden;margin:12px 0 26px}.workout-progress-track div{height:100%;background:linear-gradient(90deg,#8151e5,#c5a1ff);transition:width .25s}.workout-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;align-items:start;gap:19px}.exercise-stack{display:flex;flex-direction:column;gap:16px}.exercise-card{background:linear-gradient(140deg,#171923,#11131b);border:1px solid var(--border);border-radius:18px;padding:22px 22px 14px}.exercise-card-title{display:flex;align-items:center;gap:13px}.exercise-number{width:38px;height:38px;flex-shrink:0;border-radius:10px;display:grid;place-items:center;background:rgba(156,100,250,.14);color:#c8aaff;font-size:12px;font-weight:800}.exercise-card-title>div{flex:1}.exercise-card-title h3{font-size:15px;letter-spacing:-.02em;margin:0 0 5px}.exercise-card-title span:not(.exercise-number){font-size:10px;color:#838599}.exercise-done{font-size:11px;color:#afaac0;background:#20212d;padding:7px 9px;border-radius:8px}.exercise-hint{font-size:11px;color:#858497;margin:12px 0 22px;line-height:1.5}.sets-head,.set-row{display:grid;grid-template-columns:40px repeat(3,minmax(0,1fr)) 48px;gap:10px;align-items:center;text-align:center}.sets-head{font-size:9px;font-weight:800;letter-spacing:.045em;color:#79798d;margin-bottom:8px}.set-row{margin-bottom:9px}.set-index{color:#928fa5;background:#252431;display:grid;place-items:center;height:38px;border-radius:8px;font-size:12px;font-weight:720}.set-input{width:100%;min-width:0;text-align:center;height:38px;background:#232430;border:1px solid transparent;border-radius:8px;color:#f2eefe;font-size:13px;font-variant-numeric:tabular-nums;outline:0;padding:0 4px}.set-input:focus{border-color:#9d6bf8}.set-input::-webkit-inner-spin-button{-webkit-appearance:none}.set-complete .set-index{background:rgba(73,214,147,.13);color:#69e0aa}.set-check{height:38px;width:42px;border:1px solid rgba(144,144,169,.19);border-radius:9px;display:grid;place-items:center;color:#67697a;background:#1d1f2b}.set-check.is-done{background:rgba(65,212,135,.16);color:#63e29e;border-color:rgba(88,221,161,.32)}.exercise-footer{display:flex;gap:17px;align-items:center;justify-content:space-between;border-top:1px solid var(--border);margin-top:19px;padding:14px 0 0}.text-action-muted{color:#898599}.finish-row{display:flex;gap:11px;margin:10px 0 0}.workout-rail{position:sticky;top:26px;display:flex;flex-direction:column;gap:15px}.timer-panel{border:1px solid rgba(156,104,249,.24);border-radius:18px;background:radial-gradient(circle at 50% 30%,rgba(137,82,237,.19),transparent 67%),#181522;text-align:center;padding:26px 14px 21px}.timer-circle{width:195px;height:195px;border:4px solid rgba(162,117,245,.26);box-shadow:0 0 0 12px rgba(156,105,247,.04),inset 0 0 28px rgba(136,71,236,.08);border-radius:50%;margin:28px auto;display:flex;flex-direction:column;align-items:center;justify-content:center}.timer-circle span{font-size:43px;font-weight:720;letter-spacing:-.055em;font-variant-numeric:tabular-nums}.timer-circle small{color:#9d96b1;font-size:10px;margin-top:6px}.timer-helpers{display:flex;gap:5px;justify-content:center}.timer-helpers .btn{padding:9px 10px;font-size:10px}.timer-disclaimer{font-size:10px;color:#9891a8;margin:22px 0 0;line-height:1.6}.rail-note{display:flex;gap:11px;color:#a99cbe;padding:19px;background:#151720;border:1px solid var(--border);border-radius:14px}.rail-note p{font-size:11px;line-height:1.65;margin:0}.rail-plan{display:flex;flex-direction:column;gap:7px;background:#141720;border-radius:14px;padding:19px;border:1px solid var(--border)}.rail-plan strong{font-size:13px}.rail-plan span:last-child{font-size:11px;color:#a7a2b4}
/* Progress */
.analytics-grid{margin-top:22px}.analytics-panel{padding:24px 0 4px}.analytics-panel>.section-head{padding:0 24px}.analytics-panel .bar-chart{height:240px}.analytics-panel .chart-track{height:155px}.progress-lower{align-items:start}.history-list,.records-list{padding:0 24px 18px}.history-item{display:flex;align-items:center;gap:12px;border-top:1px solid var(--border);padding:14px 0}.history-icon{display:grid;place-items:center;width:40px;height:40px;border-radius:11px;background:rgba(147,110,221,.12);color:#b496ee}.history-item div:nth-child(2){flex:1}.history-item strong{font-size:12px;display:block;margin-bottom:6px}.history-item span{font-size:10px;color:#9390a4}.history-done{color:#5ddd9a!important}.record-item{padding:15px 0;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px}.record-item span{color:#b3afc0}.record-item strong{color:#c5acff;font-size:14px}.empty-sm{padding:28px 4px;color:#9290a4;line-height:1.6;font-size:12px}.empty-state{padding:32px;border:1px solid var(--border);background:var(--surface);border-radius:15px;color:var(--muted);font-size:13px}
/* Settings */
.settings-grid{grid-template-columns:1fr 1fr;align-items:start}.settings-panel{padding:26px}.settings-panel>.section-head{margin-bottom:24px}.form-stack{display:flex;flex-direction:column;gap:14px}.field-label{color:#d7d3e3;font-weight:670;font-size:12px;display:block;margin:7px 0 -3px}.field-label span{font-weight:400;color:#848596;font-size:10px}.text-input,.select-input{width:100%;border-radius:11px;border:1px solid rgba(204,196,232,.14);background:#1b1d29;color:#f7f3ff;height:45px;padding:0 14px;font-size:12px;outline:0}.select-input{appearance:auto}.text-input::placeholder{color:#7b7a90}.text-input:focus,.select-input:focus{border-color:#a77afa}.gear-choices{display:flex;flex-wrap:wrap;gap:9px}.check-chip input,.number-choice input,.choice-card input{position:absolute;opacity:0;width:1px;height:1px}.check-chip span{display:block;font-size:11px;color:#a8a6ba;border:1px solid rgba(212,212,238,.13);background:#1a1d27;border-radius:9px;padding:11px 13px;cursor:pointer;transition:.2s}.check-chip input:checked+span{background:rgba(154,104,247,.16);border-color:rgba(175,124,255,.65);color:#e4d5ff}.number-choices{display:flex;gap:10px}.number-choice{flex:1}.number-choice span{display:grid;place-items:center;background:#1a1d27;color:#aaa6be;border:1px solid rgba(220,220,250,.12);border-radius:10px;height:44px;cursor:pointer;font-weight:700;font-size:14px}.number-choice input:checked+span{background:rgba(154,104,247,.19);border-color:#a776f5;color:#e9ddff}.form-help{margin:18px 0 0;font-size:11px;color:#8c8ba0;line-height:1.65}.settings-feature{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid var(--border)}.settings-feature>span{color:#aa8ee6}.settings-feature strong{font-size:13px}.settings-feature p{font-size:11px;color:#9592a4;line-height:1.6;margin:6px 0}.action-stack{display:flex;flex-direction:column;gap:11px;margin-top:22px}.import-label{cursor:pointer}.settings-rule{border:0;border-top:1px solid var(--border);margin:24px 0}.danger-area strong{font-size:13px;color:#f2bbc4}.danger-area p{font-size:11px;line-height:1.6;color:#9c8992;margin:7px 0 15px}

 return `<div class="workout-header"><button class="back-button" data-action="home">${icon('back',19)} <span>Volver al inicio</span></button><span class="workout-saved">${icon('shield',15)} Guardado automático</span></div><div class="workout-title-row"><div><div class="eyebrow">SESIÓN ACTIVA · ${dateLabel(s.date)}</div><h1>${escapeHtml(s.title)}</h1><p>${s.entries.length} actividades · ${done} de ${sets} registros completados</p></div><div class="progress-circle" style="--pct:${pct}"><span>${pct}%</span></div></div>
<div class="workout-progress-track"><div style="width:${pct}%"></div></div>
<div class="workout-layout"><div class="exercise-stack">${s.entries.map((e,i)=>exerciseCard(e,i)).join('')}${s.entries.length===0?'<div class="empty-state">Añade ejercicios a la sesión desde el planificador.</div>':''}<div class="finish-row">${button('finish',`${icon('check',19)} Finalizar sesión`,'btn-primary btn-large')}${button('home','Continuar más tarde','btn-outline btn-large')}</div></div><aside class="workout-rail"><div class="timer-panel"><div class="eyebrow">TEMPORIZADOR DE DESCANSO</div><div class="timer-circle"><span data-timer-value>${timeDisplay(seconds)}</span><small data-timer-status>${seconds>0?'En marcha':'Listo para iniciar'}</small></div><div class="timer-helpers"><button class="btn btn-outline btn-mini" data-action="timer-minus">−15 s</button><button class="btn btn-primary btn-mini" data-action="timer-toggle">${icon(seconds>0?'pause':'play',16)} ${seconds>0?'Pausar':'Iniciar'}</button><button class="btn btn-outline btn-mini" data-action="timer-plus">+30 s</button></div><p class="timer-disclaimer">Temporizador de referencia. Descansa lo que necesites.</p></div><div class="rail-note">${icon('info',17)}<p>Registra únicamente series realizadas. Puedes modificar los valores antes de marcarlas como completadas.</p></div>${planned?`<div class="rail-plan"><span class="eyebrow">PLAN ORIGINAL</span><strong>${escapeHtml(planned.title)}</strong><span>${planned.minutes} min estimados</span></div>`:''}</aside></div>`;
}
function timeDisplay(secs){return `${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')}`}
function exerciseCard(e,index){
 const ex=findExercise(e.exerciseId),type=ex?.type||'strength';
 const done=e.sets.filter(set=>set.done).length;
 const fieldHead=type==='strength'?'<span>REP.</span><span>CARGA (KG)</span><span>RPE</span>':type==='cardio'?'<span>TIEMPO (MIN)</span><span>DISTANCIA (KM)</span><span>RPE</span>':'<span>TIEMPO (MIN)</span><span>RPE</span><span></span>';
 return `<article class="exercise-card"><div class="exercise-card-title"><span class="exercise-number">${String(index+1).padStart(2,'0')}</span><div><h3>${escapeHtml(ex?.name||'Ejercicio no disponible')}</h3><span>${escapeHtml(ex?.group||'Otro')} · ${escapeHtml(ex?.gear||'Personalizado')}</span></div><div class="exercise-done">${done}/${e.sets.length}</div></div><div class="exercise-hint">${escapeHtml(ex?.hint||'') }</div><div class="sets-head"><span>SERIE</span>${fieldHead}<span>HECHA</span></div><div class="sets-body">${e.sets.map((set,i)=>`<div class="set-row ${set.done?'set-complete':''}"><span class="set-index">${i+1}</span>${type==='strength'?`${setInput(e,set,'reps','Reps',1)}${setInput(e,set,'load','kg',0.5)}${setInput(e,set,'rpe','RPE',0.5)}`:type==='cardio'?`${setInput(e,set,'durationMin','min',1)}${setInput(e,set,'distanceKm','km',0.1)}${setInput(e,set,'rpe','RPE',0.5)}`:`${setInput(e,set,'durationMin','min',1)}${setInput(e,set,'rpe','RPE',0.5)}<span class="set-spacer"></span>`}<button class="set-check ${set.done?'is-done':''}" data-action="toggle-set" data-session="${escapeHtml(getCurrentSessionId())}" data-exercise="${e.exerciseId}" data-set="${set.id}" aria-label="${set.done?'Desmarcar':'Completar'} serie ${i+1}">${icon('check',18)}</button></div>`).join('')}</div><div class="exercise-footer"><button class="text-action" data-action="add-set" data-exercise="${e.exerciseId}">${icon('plus',15)} Añadir serie</button><button class="text-action text-action-muted" data-action="remove-set" data-exercise="${e.exerciseId}" ${e.sets.length<=1?'disabled':''}>${icon('minus',15)} Quitar última</button></div></article>`;
}
function getCurrentSessionId(){return currentSession()?.id||''}
function setInput(e,set,field,placeholder,step){const v=set[field]??'';return `<input class="set-input" type="number" inputmode="decimal" min="0" max="100000" step="${step}" aria-label="${placeholder}" data-field="${field}" data-exercise="${e.exerciseId}" data-set="${set.id}" value="${escapeHtml(v)}" placeholder="–" />`}

function progressPage(){const monday=weekStart(),s=statsFor(state.sessions,state.plans,monday),completed=state.sessions.filter(x=>x.status==='completed').sort((a,b)=>(b.finishedAt||'').localeCompare(a.finishedAt||'')),allVolume=completed.reduce((a,x)=>a+totalVolume(x),0),allCardio=completed.reduce((a,x)=>a+cardioTotals(x).mins,0),records=recordsFor(state.sessions);
 return `${pageHead('INTELIGENCIA DEPORTIVA','Tu progreso','Cada dato viene de tus entrenamientos realizados, nunca de estimaciones inventadas.')}
<div class="metric-grid">${smallMetric('check','Sesiones totales',`${completed.length}`,'Histórico completo')}${smallMetric('dumbbell','Volumen registrado',`${fmt(allVolume)}<span class="metric-unit"> kg</span>`,'Series con carga')}${smallMetric('activity','Cardio registrado',`${fmt(allCardio)}<span class="metric-unit"> min</span>`,'Entrenamientos cardio')}${smallMetric('award','Récords de carga',`${records.length}`,'Ejercicios con marca')}</div>
<div class="analytics-grid"><section class="panel analytics-panel">${sectionHead('Constancia','Entrenamientos completados por semana')}${barChart(historyByWeek(completed,monday,8),'count')}</section><section class="panel analytics-panel">${sectionHead('Volumen','Kg acumulados por semana, cuando se registra carga')}${barChart(historyByWeek(completed,monday,8),'volume')}</section></div>
<div class="analytics-grid progress-lower"><section class="panel"><div class="panel-header">${sectionHead('Historial de sesiones','Tus entrenamientos, ordenados por fecha')}</div><div class="history-list">${completed.length?completed.slice(0,20).map(item=>`<div class="history-item"><div class="history-icon">${icon(item.type==='Fuerza'?'dumbbell':item.type==='Resistencia'?'activity':'wind',19)}</div><div><strong>${escapeHtml(item.title)}</strong><span>${dateLabel(item.date)} · ${countDone(item)} registros · ${durationMinutes(item)} min</span></div><span class="history-done">${icon('check',16)}</span></div>`).join(''):'<div class="empty-sm">Cuando completes una sesión, aparecerá aquí automáticamente.</div>'}</div></section><section class="panel"><div class="panel-header">${sectionHead('Marcas registradas','Máxima carga utilizada por ejercicio')}</div><div class="records-list">${records.length?records.slice(0,10).map(r=>`<div class="record-item"><span>${escapeHtml(findExercise(r.exerciseId)?.name||'Ejercicio')}</span><strong>${fmt(r.load)} kg</strong></div>`).join(''):'<div class="empty-sm">Los récords aparecerán si registras cargas en ejercicios de fuerza.</div>'}</div><div class="insight-line">${icon('info',16)} No es una estimación de fuerza máxima ni un indicador de salud.</div></section></div>
<div class="tip-panel">${icon('heart',19)} <div><strong>El progreso no es lineal.</strong><p>Las pausas, los días de recuperación y los cambios de rutina también forman parte de un proceso saludable.</p></div></div>`;
}

function settingsPage(){const p=state.profile;return `${pageHead('TU ESPACIO','Preferencias','Control total sobre tu perfil y tus datos.')}
<div class="settings-grid"><section class="panel settings-panel">${sectionHead('Perfil deportivo','Puedes modificar tu configuración en cualquier momento.')}
<form data-form="settings" class="form-stack"><label class="field-label" for="edit-name">Nombre</label><input class="text-input" id="edit-name" name="name" maxlength="48" value="${escapeHtml(p?.name||'')}" placeholder="Atleta"/><label class="field-label" for="edit-goal">Objetivo principal</label><select class="select-input" id="edit-goal" name="goal">${['Rendimiento híbrido','Fuerza','Resistencia','Movilidad'].map(g=>`<option value="${g}" ${p?.goal===g?'selected':''}>${g}</option>`).join('')}</select><div class="field-label">Días planificados</div><div class="number-choices">${[3,4,5,6].map(n=>`<label class="number-choice"><input type="radio" name="days" value="${n}" ${Number(p?.days)===n?'checked':''}/><span>${n}</span></label>`).join('')}</div><div class="field-label">Equipamiento</div><div class="gear-choices">${GEAR.map(g=>`<label class="check-chip"><input type="checkbox" name="gear" value="${g.id}" ${(p?.gear||[]).includes(g.id)?'checked':''}/><span>${g.name}</span></label>`).join('')}</div><button class="btn btn-primary" type="submit">${icon('check',17)} Guardar preferencias</button></form><p class="form-help">Cambiar preferencias no modifica sesiones ya registradas ni reescribe el plan existente.</p></section>
<section class="panel settings-panel">${sectionHead('Privacidad y seguridad','Tus datos permanecen en este dispositivo.')}
<div class="settings-feature"><span>${icon('shield',19)}</span><div><strong>Sin cuenta</strong><p>No necesitas registrarte ni compartir tu historial con un servidor.</p></div></div><div class="settings-feature"><span>${icon('download',19)}</span><div><strong>Exportación de respaldo</strong><p>Guarda un archivo JSON con perfil, planes y sesiones.</p></div></div><div class="action-stack">${button('export',`${icon('download',18)} Exportar mis datos`,'btn-outline btn-block')}<label class="btn btn-outline btn-block import-label">${icon('upload',18)} Importar copia de seguridad<input type="file" id="import-file" accept=".json,application/json" hidden/></label></div><hr class="settings-rule"/><div class="danger-area"><strong>Zona de eliminación</strong><p>Eliminar los datos locales es irreversible si no conservas una copia.</p>${button('reset',`${icon('trash',17)} Eliminar todos los datos`,'btn-danger')}</div></section></div>`}

function editPlanModal(){const date=state.modal.date,existing=getPlan(date),selected=new Set(existing?.exerciseIds||[]);const selectExercises=availableExercises();return `<div class="modal-backdrop" data-action="close-modal"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><div><div class="eyebrow">EDITAR PLAN</div><h2 id="modal-title">${cap(new Intl.DateTimeFormat('es-ES',{weekday:'long',day:'numeric',month:'long'}).format(parseLocalDate(date)))}</h2></div><button class="icon-button" data-action="close-modal" aria-label="Cerrar">${icon('close',22)}</button></div><form data-form="edit-plan" class="modal-form"><input type="hidden" name="date" value="${date}"/><label class="field-label" for="plan-title">Nombre de la sesión</label><input class="text-input" id="plan-title" maxlength="70" name="title" required value="${escapeHtml(existing?.title||'Nueva sesión')}"/><label class="field-label" for="plan-type">Tipo de sesión</label><select class="select-input" id="plan-type" name="type">${[...ACTIVITY_TYPES,'Descanso'].map(type=>`<option ${existing?.type===type?'selected':''} value="${type}">${type}</option>`).join('')}</select><label class="field-label" for="plan-duration">Duración estimada (minutos)</label><input class="text-input" id="plan-duration" name="minutes" type="number" min="0" max="240" value="${existing?.minutes??60}"/><div class="field-label">Ejercicios disponibles <span>Selecciona los que correspondan</span></div><div class="modal-exercises">${selectExercises.map(ex=>`<label class="modal-exercise"><input type="checkbox" name="exercise" value="${ex.id}" ${selected.has(ex.id)?'checked':''}/><span><b>${escapeHtml(ex.name)}</b><small>${escapeHtml(ex.group)} · ${ex.type==='cardio'?'Cardio':ex.type==='mobility'?'Movilidad':'Fuerza'}</small></span></label>`).join('')}</div><div class="modal-actions"><button type="button" class="btn btn-outline" data-action="close-modal">Cancelar</button><button class="btn btn-primary" type="submit">${icon('check',17)} Guardar sesión</button></div></form></section></div>`}

function render({keepScroll=false}={}){const scroll=keepScroll?window.scrollY:0;el.innerHTML=state.profile?appShell(state.page==='home'?dashboard():state.page==='plan'?planPage():state.page==='train'?trainingPage():state.page==='progress'?progressPage():settingsPage()):onboarding();if(state.modal)el.insertAdjacentHTML('beforeend',editPlanModal());document.title=`Entreno OS · ${state.profile?(state.page==='home'?'Inicio':state.page==='plan'?'Plan':state.page==='train'?'Entrenar':state.page==='progress'?'Progreso':'Ajustes'):'Bienvenida'}`;if(keepScroll)requestAnimationFrame(()=>window.scrollTo({top:scroll}));else window.scrollTo({top:0,behavior:'instant'});updateConnectivity()}
function updateConnectivity(){const label=document.getElementById('connectivity-label');if(label)label.textContent=navigator.onLine?'Local · listo':'Sin conexión';}
function navigate(page){state.page=page;state.modal=null;history.replaceState(null,'',`#${page}`);render()}
function eventTarget(action){return action?.closest?.('[data-action]')}

async function run(action,buttonNode){
 const planId=buttonNode.dataset.plan;
 switch(action){
 case 'home': case 'plan': case 'train': case 'progress': case 'settings': return navigate(action);
 case 'resume': return navigate('train');
 case 'prev-week': state.week=addDays(state.week,-7);return render();
 case 'next-week': state.week=addDays(state.week,7);return render();
 case 'edit-plan':state.modal={date:buttonNode.dataset.date};return render({keepScroll:true});
 case 'close-modal':state.modal=null;return render({keepScroll:true});
 case 'create-week':{
   const week=state.week;
   const existing=state.plans.some(p=>p.date>=week&&p.date<addDays(week,7));
   if(existing&&!confirm('¿Regenerar el plan de esta semana? Se reemplazarán los días no registrados.'))return;
   try{await db.replaceWeek(planForWeek(state.profile,week),week);await reload();notice('Plan semanal generado');render({keepScroll:true});}catch(e){notice(e.message)}return;
 }
 case 'start':{
   const plan=state.plans.find(p=>p.id===planId);
   if(!plan){notice('No se encontró el plan');return}
   if(plan.isRest){notice('Este día está reservado para descansar');return}
   const already=getActiveForPlan(plan.id);
   const existingOther=currentSession();
   if(!already&&existingOther){notice('Hay una sesión sin terminar. Continúala antes de iniciar otra.');return navigate('train')}
   if(!already&&completedForPlan(plan.id)){notice('Esta sesión ya está completada');return}
   if(!already){await db.put('sessions',newSession(plan));await reload();}
   return navigate('train');
 }
 case 'toggle-set':{const s=currentSession(),entry=s?.entries.find(e=>e.exerciseId===buttonNode.dataset.exercise),set=entry?.sets.find(x=>x.id===buttonNode.dataset.set);if(!set)return;set.done=!set.done;s.updatedAt=new Date().toISOString();await db.put('sessions',s);return render({keepScroll:true});}
 case 'add-set':{const s=currentSession(),entry=s?.entries.find(e=>e.exerciseId===buttonNode.dataset.exercise);if(!entry)return;entry.sets.push(defaultSet(entry.exerciseId));s.updatedAt=new Date().toISOString();await db.put('sessions',s);return render({keepScroll:true});}
 case 'remove-set':{const s=currentSession(),entry=s?.entries.find(e=>e.exerciseId===buttonNode.dataset.exercise);if(!entry||entry.sets.length<=1)return;if(entry.sets.at(-1).done&&!confirm('La última serie está registrada. ¿Eliminarla?'))return;entry.sets.pop();s.updatedAt=new Date().toISOString();await db.put('sessions',s);return render({keepScroll:true});}
 case 'finish':{const s=currentSession();if(!s)return;if(countDone(s)===0){notice('Marca al menos un registro realizado antes de finalizar.');return}if(!confirm('¿Finalizar esta sesión? Los registros quedarán guardados en tu historial.'))return;s.status='completed';s.restUntil=null;s.finishedAt=new Date().toISOString();s.updatedAt=s.finishedAt;await db.put('sessions',s);await reload();notice('Sesión guardada en tu historial');return navigate('progress')}
 case 'timer-toggle':case 'timer-minus':case 'timer-plus':{const s=currentSession();if(!s)return;const remain=s.restUntil?Math.max(0,Math.ceil((s.restUntil-Date.now())/1000)):0;let secs=remain;if(action==='timer-toggle')secs=remain>0?0:90;if(action==='timer-plus')secs=remain+30;if(action==='timer-minus')secs=Math.max(0,remain-15);s.restUntil=secs?Date.now()+secs*1000:null;await db.put('sessions',s);return render({keepScroll:true});}
 case 'export':{const blob=new Blob([JSON.stringify(await db.backup(),null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`entreno-os-respaldo-${localDate()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notice('Respaldo exportado');return}
 case 'reset':{clearTimeout(inputSaveHandle);if(!confirm('¿Eliminar todos los datos de Entreno OS de este dispositivo?'))return;if(!confirm('Esta acción no se puede deshacer sin una copia. ¿Confirmas la eliminación?'))return;await db.deleteEverything();state.modal=null;state.page='home';await reload();render();notice('Datos eliminados');return}
 }
}
// Event delegation; all user-entered strings are escaped before rendering.
document.addEventListener('click',async event=>{const target=eventTarget(event.target);if(!target)return;const action=target.dataset.action;if(target.classList.contains('modal-backdrop')&&event.target!==target)return;event.preventDefault();if(state.busy)return;try{state.busy=true;await run(action,target)}catch(e){console.error(e);notice('No se pudo completar la acción: '+e.message)}finally{state.busy=false}});

let inputSaveHandle;
document.addEventListener('input',event=>{
 const input=event.target;
 if(!input.matches?.('[data-field]'))return;
 const s=currentSession(),entry=s?.entries.find(e=>e.exerciseId===input.dataset.exercise),set=entry?.sets.find(x=>x.id===input.dataset.set);
 if(!set)return;
 set[input.dataset.field]=input.value===''?'':clampNonNegative(input.value);
 s.updatedAt=new Date().toISOString();
 clearTimeout(inputSaveHandle);
 inputSaveHandle=setTimeout(()=>db.put('sessions',s).catch(e=>notice('No se guardó el valor: '+e.message)),180);
});
document.addEventListener('change',async event=>{
 const input=event.target;
 if(input.matches('[data-field]')){
  const s=currentSession(),entry=s?.entries.find(e=>e.exerciseId===input.dataset.exercise),set=entry?.sets.find(x=>x.id===input.dataset.set);if(!set)return;
  const v=input.value===''?'':clampNonNegative(input.value);
  set[input.dataset.field]=v;
  s.updatedAt=new Date().toISOString();
  try{await db.put('sessions',s);notice('Registro guardado')}catch{notice('No se guardó el cambio; inténtalo de nuevo')}
 }
 if(input.id==='import-file'&&input.files?.[0]){
  try{
   if(input.files[0].size>12*1024*1024)throw new Error('Archivo demasiado grande (máximo 12 MB).');
   const doc=JSON.parse(await input.files[0].text());
   if(!confirm('La importación reemplazará los datos actuales. ¿Continuar?'))return;
   clearTimeout(inputSaveHandle);await db.importBackup(doc);await reload();state.week=weekStart();state.page='home';render();notice('Respaldo importado correctamente');
  }catch(e){notice('No se pudo importar: '+e.message)}
 }
});

document.addEventListener('submit',async event=>{
 const form=event.target;if(!form.dataset.form)return;event.preventDefault();if(state.busy)return;state.busy=true;
 try{
  const values=new FormData(form);
  if(form.dataset.form==='onboarding'){
   const profile={name:String(values.get('name')||'').trim().slice(0,48),goal:String(values.get('goal')||'Rendimiento híbrido'),days:Number(values.get('days')||6),gear:[...new Set(['corporal',...values.getAll('gear')])],createdAt:new Date().toISOString()};
   await db.setProfile(profile);await db.replaceWeek(planForWeek(profile,weekStart()),weekStart());await reload();state.page='home';render();notice('Tu espacio está listo');
  }else if(form.dataset.form==='settings'){
   const profile={...state.profile,name:String(values.get('name')||'').trim().slice(0,48),goal:String(values.get('goal')||'Rendimiento híbrido'),days:Number(values.get('days')||6),gear:[...new Set(['corporal',...values.getAll('gear')])]};
   await db.setProfile(profile);await reload();render({keepScroll:true});notice('Preferencias actualizadas');
  }else if(form.dataset.form==='edit-plan'){
   const date=String(values.get('date')),old=getPlan(date),type=String(values.get('type')),title=String(values.get('title')||'Nueva sesión').trim().slice(0,70),duration=Math.max(0,Math.min(240,Number(values.get('minutes')||0))),ids=values.getAll('exercise').filter(x=>EXERCISES.some(e=>e.id===x));
   if(!title)throw new Error('Escribe un título válido');
   if(old&&byPlan(old.id).length){notice('Esta sesión tiene registros y no puede editarse.');return}
   const plan={id:old?.id||uuid(),date,title,type,minutes:type==='Descanso'?0:duration,exerciseIds:type==='Descanso'?[]:ids,isRest:type==='Descanso'};
   await db.put('plans',plan);state.modal=null;await reload();render({keepScroll:true});notice('Plan guardado');
  }
 }catch(e){console.error(e);notice('No se guardó: '+e.message)}finally{state.busy=false}
});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&state.modal){state.modal=null;render({keepScroll:true})}});
window.addEventListener('online',updateConnectivity);window.addEventListener('offline',updateConnectivity);
setInterval(()=>{const timer=document.querySelector('[data-timer-value]');if(!timer)return;const s=currentSession();const secs=s?.restUntil?Math.max(0,Math.ceil((s.restUntil-Date.now())/1000)):0;timer.textContent=timeDisplay(secs);const status=document.querySelector('[data-timer-status]');if(status)status.textContent=secs?'En marcha':'Listo para iniciar';},1000);
async function boot(){try{await reload();if(state.profile){const fragment=location.hash.slice(1);state.page=['home','plan','train','progress','settings'].includes(fragment)?fragment:'home';}render();/* Versión de archivo único: no requiere archivos adicionales. */}catch(error){console.error(error);el.innerHTML=`<div class="fatal"><h1>No se pudo abrir Entreno OS</h1><p>${escapeHtml(error.message)}</p><p>Revisa los permisos de almacenamiento del navegador y recarga la página.</p></div>`}}
boot();

})();
</script>
</body>
</html>
